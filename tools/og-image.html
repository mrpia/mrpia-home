<!doctype html>
<!--
  Source of public/og.png, the link preview image (Open Graph / Twitter card).
  Not deployed. Rendered at 1200x630 with the command in README.md, "Link preview image".
  Self-contained on purpose: no external files, so the render can't pick up a stale stylesheet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: grid; place-items: center;
    background-color: #0a0d12;
    background-image: radial-gradient(#1a212b 1.5px, transparent 1.8px);
    background-size: 26px 26px;
    font-family: "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    color: #d7dee8;
  }
  .term {
    width: 1110px; height: 540px;
    display: flex; flex-direction: column;
    background: #0f141b;
    border: 1.5px solid #262f3b;
    border-radius: 18px;
    box-shadow: 0 40px 90px -30px rgb(0 0 0 / .8);
    overflow: hidden;
  }
  .bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    height: 54px; padding: 0 22px;
    background: #171d26; border-bottom: 1.5px solid #262f3b;
    font-size: 21px; color: #8592a3;
  }
  .dots { display: flex; gap: 11px; }
  .dots i { width: 17px; height: 17px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .body { flex: 1; padding: 30px 44px 0; position: relative; }
  .cmd { font-size: 27px; margin: 0; }
  .ps1 { color: #7ee787; font-weight: bold; }
  .ps1 i { color: #79c0ff; font-style: normal; font-weight: normal; }
  .ps1 s { color: #d7dee8; text-decoration: none; font-weight: normal; }
  .name {
    margin: 4px 0 6px;
    font-size: 132px; font-weight: bold; line-height: 1.1; letter-spacing: -4px;
    color: #7ee787; text-shadow: 0 0 34px rgb(126 231 135 / .35);
  }
  .name span { font-size: 108px; letter-spacing: 0; vertical-align: 6px; }
  .bio { font-size: 30px; margin: 0 0 30px; }
  .bio b { color: #8592a3; font-weight: normal; }
  .ls { font-size: 24px; margin: 6px 0 0; color: #e3b341; word-spacing: 6px; }
  .foot {
    position: absolute; left: 44px; right: 44px; bottom: 26px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .cursor { color: #7ee787; }
  .url { font-size: 30px; color: #79c0ff; font-weight: bold; }
</style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span>guest@mrpia: ~</span>
      <span></span>
    </div>
    <div class="body">
      <p class="cmd"><span class="ps1">guest@mrpia<s>:</s><i>~</i><s>$</s></span> whoami</p>
      <p class="name">mrpia <span>🤓</span></p>
      <p class="bio">software geek <b>·</b> photography <b>·</b> guitar <b>·</b> raising kids</p>
      <p class="cmd"><span class="ps1">guest@mrpia<s>:</s><i>~</i><s>$</s></span> ls ~/stuff</p>
      <p class="ls">math-quizz/ geo-quizz/ arena-race/ arena-maze/ arena-starter/</p>
      <div class="foot">
        <p class="cmd"><span class="ps1">guest@mrpia<s>:</s><i>~</i><s>$</s></span> <span class="cursor">█</span></p>
        <span class="url">mrpia.ch</span>
      </div>
    </div>
  </div>
</body>
</html>
